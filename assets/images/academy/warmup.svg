<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b1a0b"/>
      <stop offset=".6" stop-color="#221009"/>
      <stop offset="1" stop-color="#110804"/>
    </linearGradient>
    <radialGradient id="glow" cx="68%" cy="14%" r="68%">
      <stop offset="0" stop-color="#ff8c00" stop-opacity=".46"/>
      <stop offset="1" stop-color="#ff8c00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd6a6"/>
      <stop offset="1" stop-color="#ff8a28"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <!-- pitch -->
  <g stroke="#ff9a4d" stroke-opacity=".15" fill="none" stroke-width="2">
    <path d="M-20 446 H820"/>
    <path d="M560 446 V500"/>
    <path d="M0 470 H800"/>
  </g>

  <!-- big clock ring -->
  <g transform="translate(640 176)">
    <circle cx="0" cy="0" r="92" fill="rgba(20,9,5,.4)" stroke="#ff9a4d" stroke-opacity=".3" stroke-width="3"/>
    <circle cx="0" cy="0" r="76" fill="none" stroke="#ffb877" stroke-width="6" stroke-dasharray="360 120" stroke-linecap="round" transform="rotate(-90)"/>
    <g stroke="#ffb877" stroke-opacity=".6" stroke-width="4" stroke-linecap="round">
      <path d="M0 -60 V-50"/><path d="M60 0 H50"/><path d="M0 60 V50"/><path d="M-60 0 H-50"/>
      <path d="M42 -42 L35 -35"/><path d="M42 42 L35 35"/><path d="M-42 42 L-35 35"/><path d="M-42 -42 L-35 -35"/>
    </g>
    <path d="M0 -6 V30 L26 44" fill="none" stroke="#ffe0c0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- warm-up arcs -->
  <g fill="none" stroke="#ffb877" stroke-opacity=".5" stroke-width="4" stroke-linecap="round">
    <path d="M112 300 C 148 268, 190 262, 226 278"/>
    <path d="M96 340 C 142 296, 196 286, 240 306"/>
  </g>

  <!-- stretching player (lunge) -->
  <ellipse cx="330" cy="450" rx="150" ry="18" fill="#000" opacity=".32" filter="url(#soft)"/>
  <g fill="none" stroke="url(#fig)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <path d="M316 226 L306 302 L246 350 L196 384"/>
    <path d="M306 302 L372 344 L436 360"/>
    <path d="M316 226 L282 168 L250 138"/>
    <path d="M316 226 L364 178 L404 154"/>
    <path d="M316 206 L314 286"/>
  </g>
  <circle cx="322" cy="166" r="29" fill="#ffdcb6"/>

  <!-- cones -->
  <g transform="translate(548 396)">
    <path d="M0 40 L22 0 L44 40 Z" fill="#ff6a00"/>
    <path d="M13 22 H31 L36 32 H8 Z" fill="#ffe6cc"/>
  </g>
  <g transform="translate(632 410)">
    <path d="M0 36 L20 0 L40 36 Z" fill="#ff7a12"/>
    <path d="M12 20 H28 L33 30 H7 Z" fill="#ffe6cc"/>
  </g>

  <!-- water bottle -->
  <g transform="translate(700 396)">
    <rect x="0" y="0" width="24" height="52" rx="8" fill="#ffb877" opacity=".85"/>
    <rect x="6" y="-10" width="12" height="12" rx="4" fill="#ffe0c0"/>
    <rect x="3" y="16" width="18" height="16" rx="4" fill="#f04416" opacity=".75"/>
  </g>

  <!-- breathe marks -->
  <g stroke="#ffd0a0" stroke-opacity=".6" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M458 140 C 472 128, 488 128, 500 140"/>
    <path d="M470 116 C 480 108, 492 108, 502 116"/>
  </g>
</svg>
