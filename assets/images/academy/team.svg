<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1309"/>
      <stop offset=".5" stop-color="#5c2408"/>
      <stop offset="1" stop-color="#a23a08"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd08a"/>
      <stop offset=".55" stop-color="#ff8c00"/>
      <stop offset="1" stop-color="#f04416" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1b0c"/>
      <stop offset="1" stop-color="#140a05"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="430" cy="286" r="150" fill="url(#sun)"/>
  <circle cx="430" cy="286" r="86" fill="#ffb04d" opacity=".9"/>
  <circle cx="430" cy="286" r="86" fill="none" stroke="#ffe0b0" stroke-opacity=".5" stroke-width="3"/>

  <!-- Hadramout skyline -->
  <g fill="#1b0c06" opacity=".94">
    <rect x="24" y="252" width="58" height="118"/>
    <rect x="92" y="222" width="44" height="148"/>
    <rect x="146" y="268" width="66" height="102"/>
    <rect x="222" y="238" width="38" height="132"/>
    <rect x="270" y="274" width="58" height="96"/>
    <rect x="338" y="244" width="34" height="126"/>
    <rect x="382" y="270" width="52" height="100"/>
    <rect x="444" y="236" width="40" height="134"/>
    <rect x="494" y="264" width="62" height="106"/>
    <rect x="566" y="230" width="36" height="140"/>
    <rect x="612" y="258" width="58" height="112"/>
    <rect x="680" y="238" width="42" height="132"/>
    <rect x="732" y="272" width="54" height="98"/>
  </g>
  <g fill="#ffb04d" opacity=".55">
    <rect x="42" y="272" width="8" height="12"/><rect x="58" y="272" width="8" height="12"/>
    <rect x="42" y="296" width="8" height="12"/><rect x="58" y="296" width="8" height="12"/>
    <rect x="104" y="244" width="8" height="12"/><rect x="118" y="244" width="8" height="12"/>
    <rect x="104" y="268" width="8" height="12"/><rect x="118" y="268" width="8" height="12"/>
    <rect x="164" y="290" width="8" height="12"/><rect x="182" y="290" width="8" height="12"/>
    <rect x="164" y="314" width="8" height="12"/><rect x="182" y="314" width="8" height="12"/>
    <rect x="352" y="266" width="7" height="11"/><rect x="352" y="288" width="7" height="11"/>
    <rect x="458" y="258" width="7" height="11"/><rect x="458" y="280" width="7" height="11"/>
    <rect x="580" y="252" width="7" height="11"/><rect x="580" y="274" width="7" height="11"/>
    <rect x="696" y="260" width="7" height="11"/><rect x="696" y="282" width="7" height="11"/>
  </g>

  <!-- ground -->
  <rect x="0" y="368" width="800" height="132" fill="url(#ground)"/>
  <path d="M0 368 H800" stroke="#ff9a4d" stroke-opacity=".22" stroke-width="2"/>
  <g stroke="#ff9a4d" stroke-opacity=".14" fill="none" stroke-width="2">
    <path d="M400 368 V500"/>
    <ellipse cx="400" cy="500" rx="230" ry="86"/>
  </g>

  <!-- team huddle -->
  <g fill="#120804">
    <!-- arms linking -->
    <path d="M214 340 C 250 322, 286 322, 320 340 L 320 360 C 284 344, 250 344, 214 360 Z"/>
    <path d="M318 340 C 354 320, 392 320, 428 340 L 428 360 C 392 342, 354 342, 318 360 Z"/>
    <path d="M426 340 C 462 320, 500 320, 536 340 L 536 360 C 500 342, 462 342, 426 360 Z"/>
    <path d="M534 340 C 570 320, 608 320, 644 340 L 644 360 C 608 342, 570 342, 534 360 Z"/>

    <!-- players -->
    <g>
      <circle cx="244" cy="270" r="25"/><path d="M244 296 C 226 300, 218 318, 216 346 L 214 420 H 274 L 272 346 C 270 318, 262 300, 244 296 Z"/>
    </g>
    <g>
      <circle cx="346" cy="250" r="27"/><path d="M346 278 C 326 282, 318 302, 316 332 L 314 424 H 378 L 376 332 C 374 302, 366 282, 346 278 Z"/>
    </g>
    <g>
      <circle cx="452" cy="236" r="29"/><path d="M452 266 C 430 270, 420 292, 418 324 L 416 426 H 488 L 486 324 C 484 292, 474 270, 452 266 Z"/>
    </g>
    <g>
      <circle cx="558" cy="250" r="27"/><path d="M558 278 C 538 282, 530 302, 528 332 L 526 424 H 590 L 588 332 C 586 302, 578 282, 558 278 Z"/>
    </g>
    <g>
      <circle cx="660" cy="270" r="25"/><path d="M660 296 C 642 300, 634 318, 632 346 L 630 420 H 690 L 688 346 C 686 318, 678 300, 660 296 Z"/>
    </g>
  </g>

  <!-- rim light -->
  <g fill="none" stroke="#ffb877" stroke-opacity=".4" stroke-width="3" stroke-linecap="round">
    <path d="M226 258 A 26 26 0 0 1 262 262"/>
    <path d="M328 238 A 28 28 0 0 1 366 244"/>
    <path d="M434 224 A 30 30 0 0 1 476 230"/>
    <path d="M540 238 A 28 28 0 0 1 578 244"/>
    <path d="M642 258 A 26 26 0 0 1 678 262"/>
  </g>

  <!-- ball in front -->
  <g transform="translate(452 438)">
    <circle cx="0" cy="0" r="30" fill="#fff4e6"/>
    <g fill="#24130c" opacity=".85">
      <path d="M0 -20 L15 -10 L9 8 H-9 L-15 -10 Z"/>
      <path d="M-30 -6 L-18 0 L-21 14 L-32 10 Z"/>
      <path d="M30 -6 L19 1 L22 14 L32 10 Z"/>
    </g>
  </g>

  <!-- dust -->
  <g fill="#ffb877" opacity=".18" filter="url(#soft)">
    <ellipse cx="190" cy="436" rx="60" ry="12"/>
    <ellipse cx="710" cy="440" rx="56" ry="12"/>
  </g>
</svg>
