<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3c1c0c"/>
      <stop offset=".58" stop-color="#221008"/>
      <stop offset="1" stop-color="#110804"/>
    </linearGradient>
    <radialGradient id="glow" cx="62%" cy="20%" r="62%">
      <stop offset="0" stop-color="#ff8c00" stop-opacity=".48"/>
      <stop offset="1" stop-color="#ff8c00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ballG" cx="34%" cy="26%" r="80%">
      <stop offset="0" stop-color="#fffaf2"/>
      <stop offset=".6" stop-color="#ffd6a8"/>
      <stop offset="1" stop-color="#c0702a"/>
    </radialGradient>
    <linearGradient id="leg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd6a6"/>
      <stop offset="1" stop-color="#ff8a28"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <!-- ground + cone square -->
  <g stroke="#ff9a4d" stroke-opacity=".16" fill="none" stroke-width="2">
    <path d="M-20 452 H820"/>
    <path d="M188 336 L436 322 L456 452 L196 464 Z"/>
  </g>
  <g>
    <g transform="translate(172 392)">
      <path d="M0 38 L20 0 L40 38 Z" fill="#ff6a00"/>
      <path d="M12 21 H28 L33 30 H7 Z" fill="#ffe6cc"/>
    </g>
    <g transform="translate(424 380)">
      <path d="M0 38 L20 0 L40 38 Z" fill="#ff7a12"/>
      <path d="M12 21 H28 L33 30 H7 Z" fill="#ffe6cc"/>
    </g>
  </g>

  <!-- target arcs around ball -->
  <g fill="none" stroke="#ffb877" stroke-opacity=".4" stroke-width="3">
    <circle cx="500" cy="360" r="128" stroke-dasharray="10 16"/>
    <circle cx="500" cy="360" r="96" stroke-dasharray="8 14"/>
  </g>

  <!-- player upper body / leg -->
  <g>
    <ellipse cx="330" cy="452" rx="150" ry="22" fill="#000" opacity=".34" filter="url(#soft)"/>
    <path d="M188 120 C 214 106, 244 116, 250 146 L 262 214 C 268 244, 250 266, 224 268 L 176 270 C 152 268, 140 248, 148 226 L 170 158 C 176 138, 178 128, 188 120 Z" fill="#24110a" opacity=".75"/>
    <g fill="none" stroke="url(#leg)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
      <path d="M238 236 L 316 306 L 410 330"/>
    </g>
    <path d="M386 314 C 410 314, 434 322, 448 338 L 430 358 C 412 346, 394 340, 376 338 Z" fill="#ffb877"/>
  </g>

  <!-- ball -->
  <g>
    <circle cx="500" cy="360" r="76" fill="url(#ballG)"/>
    <g fill="#24130c" opacity=".82">
      <path d="M500 312 L538 340 L524 384 H476 L462 340 Z"/>
      <path d="M424 352 L454 368 L446 402 L418 392 Z"/>
      <path d="M576 352 L548 370 L556 402 L582 390 Z"/>
      <path d="M470 426 L492 410 H508 L530 426 L516 440 H484 Z"/>
    </g>
    <circle cx="500" cy="360" r="76" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="3"/>
    <ellipse cx="472" cy="322" rx="26" ry="16" fill="#fff" opacity=".35" transform="rotate(-28 472 322)"/>
  </g>

  <!-- touch marker -->
  <g transform="translate(414 340)">
    <circle cx="0" cy="0" r="15" fill="none" stroke="#ffcf9e" stroke-width="4"/>
    <path d="M-24 -24 L-12 -12 M24 -24 L12 -12 M-24 24 L-12 12 M24 24 L12 12" stroke="#ffcf9e" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- motion arcs -->
  <g fill="none" stroke="#ffb877" stroke-opacity=".55" stroke-width="4" stroke-linecap="round">
    <path d="M600 240 C 640 250, 664 276, 668 312"/>
    <path d="M628 216 C 682 232, 712 268, 716 316"/>
  </g>
</svg>
