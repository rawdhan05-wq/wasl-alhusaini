<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b1a0b"/>
      <stop offset=".6" stop-color="#221009"/>
      <stop offset="1" stop-color="#110804"/>
    </linearGradient>
    <radialGradient id="glow" cx="24%" cy="10%" r="70%">
      <stop offset="0" stop-color="#ff8c00" stop-opacity=".44"/>
      <stop offset="1" stop-color="#ff8c00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd6a6"/>
      <stop offset="1" stop-color="#ff8a28"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <!-- ground -->
  <path d="M-20 420 H820" stroke="#ff9a4d" stroke-opacity=".16" stroke-width="2"/>

  <!-- agility ladder in perspective -->
  <g fill="none" stroke="#ffb877" stroke-opacity=".42" stroke-width="3">
    <path d="M96 462 L156 322 L470 322 L432 462 Z"/>
    <path d="M124 430 H452"/>
    <path d="M136 402 H458"/>
    <path d="M146 376 H463"/>
    <path d="M154 352 H467"/>
    <path d="M162 334 H470"/>
  </g>
  <g stroke="#ff6a00" stroke-opacity=".5" stroke-width="2">
    <path d="M124 430 L136 402"/>
    <path d="M452 430 L458 402"/>
    <path d="M136 402 L146 376"/>
    <path d="M458 402 L463 376"/>
    <path d="M146 376 L154 352"/>
    <path d="M463 376 L467 352"/>
    <path d="M154 352 L162 334"/>
    <path d="M467 352 L470 334"/>
  </g>

  <!-- footprint markers -->
  <g fill="#ffd0a0" opacity=".85">
    <ellipse cx="196" cy="418" rx="9" ry="15" transform="rotate(-12 196 418)"/>
    <ellipse cx="238" cy="392" rx="9" ry="15" transform="rotate(8 238 392)"/>
    <ellipse cx="282" cy="418" rx="9" ry="15" transform="rotate(-12 282 418)"/>
    <ellipse cx="326" cy="392" rx="9" ry="15" transform="rotate(8 326 392)"/>
    <ellipse cx="368" cy="418" rx="9" ry="15" transform="rotate(-12 368 418)"/>
    <ellipse cx="410" cy="392" rx="9" ry="15" transform="rotate(8 410 392)"/>
  </g>

  <!-- running player -->
  <ellipse cx="556" cy="440" rx="92" ry="15" fill="#000" opacity=".34" filter="url(#soft)"/>
  <g fill="none" stroke="url(#fig)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <path d="M548 268 L534 322 L578 348 L566 396"/>
    <path d="M534 322 L498 358 L508 404"/>
    <path d="M556 212 L600 246 L636 226"/>
    <path d="M556 212 L512 244 L474 226"/>
    <path d="M552 188 L550 268"/>
  </g>
  <circle cx="552" cy="148" r="28" fill="#ffdcb6"/>
  <path d="M528 138 A 28 28 0 0 1 576 138" fill="none" stroke="#ff6a00" stroke-width="7" stroke-linecap="round"/>

  <!-- speed lines -->
  <g stroke="#ffb877" stroke-opacity=".62" stroke-width="5" stroke-linecap="round">
    <path d="M636 214 H704"/>
    <path d="M650 244 H714"/>
    <path d="M638 274 H692"/>
    <path d="M664 304 H712"/>
  </g>

  <!-- stopwatch -->
  <g transform="translate(672 96)">
    <circle cx="0" cy="0" r="44" fill="rgba(20,9,5,.55)" stroke="#ff9a4d" stroke-opacity=".45" stroke-width="3"/>
    <circle cx="0" cy="0" r="34" fill="none" stroke="#ffb877" stroke-width="4" stroke-dasharray="150 64" stroke-linecap="round" transform="rotate(-90)"/>
    <path d="M0 -6 V14 L14 22" fill="none" stroke="#ffe0c0" stroke-width="5" stroke-linecap="round"/>
    <path d="M-10 -52 H10" stroke="#ff9a4d" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
